version: 2
# Minor and patch releases move together within each dependency surface so one
# weekly refresh produces reviewable batches without hiding major migrations.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      root-go-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: gomod
    directory: /integration
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      integration-go-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: gomod
    directory: /tools/renderwarm
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      renderwarm-go-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    groups:
      root-npm-compatible:
        patterns: ["*"]
