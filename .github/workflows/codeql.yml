name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: false

      - name: build Go analysis surfaces
        if: matrix.language == 'go'
        run: |
          go build ./...
          go test -exec=/bin/true -run '^$' -tags=integration,lighthouse,multiapp,verifiercalibration ./...
          go test -exec=/bin/true -run '^$' -tags=watcherstress ./internal/forj
          (cd integration && GOWORK=off go test -exec=/bin/true -run '^$' -tags=integration_backup ./...)
          (cd integration && GOWORK=off go test -exec=/bin/true -run '^$' -tags=integration_generator ./...)
          (cd tools/renderwarm && GOWORK=off go build ./...)

      - name: analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: /language:${{ matrix.language }}
