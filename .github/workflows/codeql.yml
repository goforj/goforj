name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: build Go analysis surfaces
        if: matrix.language == 'go'
        run: |
          go build ./...
          go test -exec=/bin/true -run '^$' -tags=integration,lighthouse,multiapp,verifiercalibration ./...
          go test -exec=/bin/true -run '^$' -tags=watcherstress ./internal/forj
          (cd integration && GOWORK=off go test -exec=/bin/true -run '^$' -tags=integration_backup ./...)
          (cd integration && GOWORK=off go test -exec=/bin/true -run '^$' -tags=integration_generator ./...)
          (cd tools/renderwarm && GOWORK=off go build ./...)

      - name: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
