name: Multi-App Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  GOPRIVATE: "github.com/goforj/*"
  GOCACHE: /tmp/gocache
  GOMODCACHE: /tmp/gomodcache

jobs:
  make-app-runtime:
    runs-on: ubuntu-latest
    env:
      CLICOLOR_FORCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Download Go modules
        run: go mod download

      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Build GoForj binary
        run: go install ./cmd/forj

      - name: Run make:app multi-app runtime smoke
        run: go test -tags=integration,multiapp ./internal/forj -run 'TestMakeAppMultiApp(Runtime|SQLiteMigrations)Smoke' -count=1 -v
