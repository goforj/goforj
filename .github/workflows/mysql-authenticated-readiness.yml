name: MySQL authenticated readiness

permissions:
  contents: read

on:
  workflow_dispatch:
  # Register feature-branch dispatches without starting containers during pull requests.
  pull_request:
    paths:
      - internal/forj/dev_database_preparation.go
      - internal/forj/dev_database_preparation_test.go
      - internal/forj/dev_database_scripts.go
      - internal/forj/dev_scripts/mysql_ready.sh
      - internal/forj/dev_mysql_readiness_native_test.go
      - .github/workflows/mysql-authenticated-readiness.yml

concurrency:
  group: mysql-authenticated-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-mysql-readiness:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache
      GOWORK: 'off'
      GOFORJ_NATIVE_MYSQL_READINESS: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Pull exact MariaDB image
        run: docker pull mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
      - name: Prove fresh concurrent authenticated readiness
        shell: bash
        run: |
          set -euo pipefail
          go test -race -tags=integration_mysql_readiness ./internal/forj -run '^TestNativeMySQLAuthenticatedReadiness$' -count=1 -timeout=3m -v | tee mysql-authenticated-readiness.log
      - name: Retain native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-authenticated-readiness-${{ github.run_id }}
          path: mysql-authenticated-readiness.log
          if-no-files-found: error
          retention-days: 7
