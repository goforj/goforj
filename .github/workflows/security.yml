name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  go-vulnerabilities:
    name: Go vulnerabilities (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            module: "."
            tags: ""
          - name: root integrations
            module: "."
            tags: integration,lighthouse,multiapp,verifiercalibration
          - name: root watcher stress
            module: "."
            tags: watcherstress
          - name: root wire generator
            module: "."
            tags: wireinject
          - name: integration
            module: integration
            tags: ""
          - name: integration backup
            module: integration
            tags: integration_backup
          - name: integration generator
            module: integration
            tags: integration_generator
          - name: render warm
            module: tools/renderwarm
            tags: ""
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: false

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: scan module
        run: bash scripts/check-vulnerabilities.sh "${{ matrix.module }}" "${{ matrix.tags }}"

  frontend-vulnerabilities:
    name: frontend vulnerabilities (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - templates/demo/frontend
          - templates/internal/lighthouse/ui
          - templates/starter-kits/react/frontend
          - templates/starter-kits/templ-htmx/frontend
          - templates/starter-kits/vue/frontend
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: audit lockfile
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only

  secrets:
    name: committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: set up go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: false

      - name: install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: scan history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner

  sbom:
    name: software bills of materials
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: false

      - name: set up node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: generate Go SBOMs
        run: |
          mkdir -p sbom
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod mod -test -json -licenses -noserial -notimestamp -output sbom/go-root.cdx.json .
          (cd integration && cyclonedx-gomod mod -test -json -licenses -noserial -notimestamp -output "$GITHUB_WORKSPACE/sbom/go-integration.cdx.json" .)
          (cd tools/renderwarm && cyclonedx-gomod mod -test -json -licenses -noserial -notimestamp -output "$GITHUB_WORKSPACE/sbom/go-renderwarm.cdx.json" .)

      - name: generate npm SBOMs
        run: |
          for directory in \
            templates/demo/frontend \
            templates/internal/lighthouse/ui \
            templates/starter-kits/react/frontend \
            templates/starter-kits/templ-htmx/frontend \
            templates/starter-kits/vue/frontend
          do
            name="$(printf '%s' "$directory" | sed 's#^\.$#root#; s#[/.]#-#g')"
            npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
              --package-lock-only \
              --output-reproducible \
              --output-file "$PWD/sbom/npm-$name.cdx.json" \
              "$directory/package.json"
          done

      - name: verify SBOM coverage
        run: |
          for bill in sbom/*.cdx.json
          do
            jq -e '(.components // []) | length > 0' "$bill" >/dev/null
          done
          jq -e 'any(.components[]?; .name == "github.com/testcontainers/testcontainers-go")' sbom/go-integration.cdx.json >/dev/null

      - name: upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/*.cdx.json
          retention-days: 14
