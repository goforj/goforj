name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # ------------------------------------------------------------------
      # SAFE: Cache only the Go BUILD cache (compiled artifacts)
      # This avoids tar conflicts and still speeds up wire + go build 5-10x
      # ------------------------------------------------------------------
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-

      # ------------------------------------------------------------------
      # Pre-fetch modules (not cached, but very fast and reliable)
      # ------------------------------------------------------------------
      - name: Download Go modules
        run: go mod download

      # ------------------------------------------------------------------
      # Install wire once (fast since build cache is restored)
      # ------------------------------------------------------------------
      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Run unit tests
        run: go test ./... -v

      # ------------------------------------------------------------------
      # Build GoForj binary (after cache restore)
      # ------------------------------------------------------------------
      - name: Build GoForj binary
        run: go install ./cmd/forj

      # ------------------------------------------------------------------
      # Run forj test-renders
      # Make sure it uses THE SAME caches for wire/build speed
      # ------------------------------------------------------------------
      - name: Run forj test-renders
        env:
          GOMODCACHE: /home/runner/go/pkg/mod       # default; safe
          GOCACHE: /home/runner/.cache/go-build     # from cache
        run: forj test:renders
