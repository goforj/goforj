name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: false # disable default job
    runs-on: [self-hosted, linux, x64, docker, goforj]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # ------------------------------------------------------------------
      # Pre-fetch modules (not cached, but very fast and reliable)
      # ------------------------------------------------------------------
      - name: Download Go modules
        run: go mod download

      # ------------------------------------------------------------------
      # Install wire once (fast since build cache is restored)
      # ------------------------------------------------------------------
      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Run unit tests
        run: go test ./... -v

      # ------------------------------------------------------------------
      # Build GoForj binary (after cache restore)
      # ------------------------------------------------------------------
      - name: Build GoForj binary
        run: go install ./cmd/forj

      # ------------------------------------------------------------------
      # Run forj test-renders
      # Make sure it uses THE SAME caches for wire/build speed
      # ------------------------------------------------------------------
      - name: Run forj test-renders
        env:
          GOMODCACHE: /home/runner/go/pkg/mod       # default; safe
          GOCACHE: /home/runner/.cache/go-build     # from cache
          CLICOLOR_FORCE: "1"
        run: forj test:renders --full

  integration:
    runs-on: [self-hosted, linux, x64, docker, goforj]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Verify Docker runtime
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            if [ "$(id -u)" = "0" ]; then
              apt-get update
              apt-get install -y docker.io
            else
              echo "Docker is missing and sudo is unavailable; please preinstall Docker on this runner."
              exit 1
            fi
          fi
          if ! command -v docker-compose >/dev/null 2>&1 && ! docker compose version >/dev/null 2>&1; then
            if [ "$(id -u)" = "0" ]; then
              apt-get update
              apt-get install -y docker-compose-plugin
            else
              echo "Docker Compose is missing and sudo is unavailable; please preinstall Docker Compose on this runner."
              exit 1
            fi
          fi
          docker info
          if command -v docker-compose >/dev/null 2>&1; then
            docker-compose version
          else
            docker compose version
          fi

      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Build GoForj binary
        run: go install ./cmd/forj

      - name: Render integration app and bring up services
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          echo "INTEGRATION_TMP_DIR=$TMP_DIR" >> "$GITHUB_ENV"
          cd "$TMP_DIR"
          cat <<'EOF' > .goforj.yml
          project_name: IntegrationApp
          module_name: github.com/test/project
          updated_at: 2026-01-01 00:00:00 UTC
          components:
            cli: true
            docker: true
            web_api: true
            jobs: true
            scheduler: true
            database_sqlite: true
          EOF
          forj render
          if command -v docker-compose >/dev/null 2>&1; then
            docker-compose down -v --remove-orphans || true
            docker-compose up -d
          else
            docker compose down -v --remove-orphans || true
            docker compose up -d
          fi

      - name: Run devconsole integration tests
        env:
          GOMODCACHE: /home/runner/go/pkg/mod
          GOCACHE: /home/runner/.cache/go-build
        run: go test -tags=integration ./internal/forj -v

      - name: Tear down integration services
        if: always()
        run: |
          if [ -n "${INTEGRATION_TMP_DIR:-}" ] && [ -d "$INTEGRATION_TMP_DIR" ]; then
            cd "$INTEGRATION_TMP_DIR"
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose down -v --remove-orphans || true
            else
              docker compose down -v --remove-orphans || true
            fi
            rm -rf "$INTEGRATION_TMP_DIR"
          fi

      - name: Run modelgen integration tests (all DB variants)
        env:
          GOMODCACHE: /home/runner/go/pkg/mod
          GOCACHE: /home/runner/.cache/go-build
        run: |
          set -euo pipefail
          for variant in mysql postgres sqlite; do
            TMP_DIR="$(mktemp -d)"
            echo "Running modelgen integration for $variant in $TMP_DIR"
            cd "$TMP_DIR"
            case "$variant" in
              mysql)
                printf '%s\n' \
                  'project_name: IntegrationMySQL' \
                  'module_name: github.com/test/project' \
                  'updated_at: 2026-01-01 00:00:00 UTC' \
                  'components:' \
                  '  cli: true' \
                  '  docker: true' \
                  '  database_mysql: true' \
                  > .goforj.yml
                ;;
              postgres)
                printf '%s\n' \
                  'project_name: IntegrationPostgres' \
                  'module_name: github.com/test/project' \
                  'updated_at: 2026-01-01 00:00:00 UTC' \
                  'components:' \
                  '  cli: true' \
                  '  docker: true' \
                  '  database_postgres: true' \
                  > .goforj.yml
                ;;
              sqlite)
                printf '%s\n' \
                  'project_name: IntegrationSQLite' \
                  'module_name: github.com/test/project' \
                  'updated_at: 2026-01-01 00:00:00 UTC' \
                  'components:' \
                  '  cli: true' \
                  '  docker: true' \
                  '  database_sqlite: true' \
                  > .goforj.yml
                ;;
            esac
            forj render
            if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
              if command -v docker-compose >/dev/null 2>&1; then
                COMPOSE_PROJECT_NAME="goforj-integration-$variant" docker-compose down -v --remove-orphans || true
                COMPOSE_PROJECT_NAME="goforj-integration-$variant" docker-compose up -d
              else
                COMPOSE_PROJECT_NAME="goforj-integration-$variant" docker compose down -v --remove-orphans || true
                COMPOSE_PROJECT_NAME="goforj-integration-$variant" docker compose up -d
              fi
            fi
            cd "$GITHUB_WORKSPACE"
            case "$variant" in
              mysql)
                DB_DRIVER=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=db DB_USERNAME=user DB_PASSWORD=password \
                  forj test:integration -v
                ;;
              postgres)
                DB_DRIVER=postgres DB_HOST=127.0.0.1 DB_PORT=5432 DB_DATABASE=app DB_USERNAME=postgres DB_PASSWORD=postgres \
                  forj test:integration -v
                ;;
              sqlite)
                DB_DRIVER=sqlite DB_DATABASE=./_data/sqlite/app.db forj test:integration -v
                ;;
            esac
            cd "$TMP_DIR"
            if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
              if command -v docker-compose >/dev/null 2>&1; then
                COMPOSE_PROJECT_NAME="goforj-integration-$variant" docker-compose down -v --remove-orphans || true
              else
                COMPOSE_PROJECT_NAME="goforj-integration-$variant" docker compose down -v --remove-orphans || true
              fi
            fi
            rm -rf "$TMP_DIR"
          done
