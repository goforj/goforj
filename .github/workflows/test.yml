name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: false # disable default job
    runs-on: [self-hosted, linux, x64, docker, goforj]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Purge Go build cache
        if: false # Temporarily disabled: deterministic test-renders workspace should improve cache reuse.
        run: |
          set -euo pipefail
          GOCACHE_DIR="$(go env GOCACHE)"
          echo "Purging GOCACHE at: $GOCACHE_DIR"
          rm -rf "$GOCACHE_DIR"
          # Defensive cleanup for self-hosted runner paths that can leak across Docker overlays.
          rm -rf "$HOME/.cache/go-build" || true
          go clean -cache -testcache || true

      # ------------------------------------------------------------------
      # Pre-fetch modules (local runner cache)
      # ------------------------------------------------------------------
      - name: Download Go modules
        run: go mod download

      # ------------------------------------------------------------------
      # Install wire once (local runner cache)
      # ------------------------------------------------------------------
      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Run unit tests
        run: go test ./... -v

      # ------------------------------------------------------------------
      # Build GoForj binary
      # ------------------------------------------------------------------
      - name: Build GoForj binary
        run: go install ./cmd/forj

      # ------------------------------------------------------------------
      # Run forj test-renders
      # ------------------------------------------------------------------
      - name: Run forj test-renders
        env:
          CLICOLOR_FORCE: "1"
          FORJ_TEST_RENDERS_WORKERS: "1"
        run: forj test:renders --full

  integration:
    runs-on: [self-hosted, linux, x64, docker, goforj]
    env:
      CLICOLOR_FORCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Purge Go build cache
        if: true # Temporarily disabled: deterministic test-renders workspace should improve cache reuse.
        run: |
          set -euo pipefail
          GOCACHE_DIR="$(go env GOCACHE)"
          echo "Purging GOCACHE at: $GOCACHE_DIR"
          rm -rf "$GOCACHE_DIR"
          # Defensive cleanup for self-hosted runner paths that can leak across Docker overlays.
          rm -rf "$HOME/.cache/go-build" || true
          go clean -cache -testcache || true

      - name: Verify Docker runtime
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            if [ "$(id -u)" = "0" ]; then
              apt-get update
              apt-get install -y docker.io
            else
              echo "Docker is missing and sudo is unavailable; please preinstall Docker on this runner."
              exit 1
            fi
          fi
          if ! command -v docker-compose >/dev/null 2>&1 && ! docker compose version >/dev/null 2>&1; then
            if [ "$(id -u)" = "0" ]; then
              apt-get update
              apt-get install -y docker-compose-plugin
            else
              echo "Docker Compose is missing and sudo is unavailable; please preinstall Docker Compose on this runner."
              exit 1
            fi
          fi
          docker info
          if command -v docker-compose >/dev/null 2>&1; then
            docker-compose version
          else
            docker compose version
          fi

      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Build GoForj binary
        run: go install ./cmd/forj

      - name: Render integration app and bring up services
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          echo "INTEGRATION_TMP_DIR=$TMP_DIR" >> "$GITHUB_ENV"
          cd "$TMP_DIR"
          cat <<'EOF' > .goforj.yml
          project_name: IntegrationApp
          module_name: github.com/test/project
          updated_at: 2026-01-01 00:00:00 UTC
          render:
            queue_driver: redis
            goforj_version: 0.1.0
            components:
              cli: true
              docker: true
              web_api: true
              jobs: true
              scheduler: true
              database_sqlite: true
          EOF
          forj render
          if [ -f docker-compose.yml ]; then
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose down -v --remove-orphans || true
              docker-compose up -d
            else
              docker compose down -v --remove-orphans || true
              docker compose up -d
            fi
          else
            echo "docker-compose.yml not generated; skipping service startup"
          fi

      - name: Run devconsole integration tests
        run: go test -tags=integration ./internal/forj -v

      - name: Tear down integration services
        if: always()
        run: |
          if [ -n "${INTEGRATION_TMP_DIR:-}" ] && [ -d "$INTEGRATION_TMP_DIR" ]; then
            cd "$INTEGRATION_TMP_DIR"
            if [ -f docker-compose.yml ]; then
              if command -v docker-compose >/dev/null 2>&1; then
                docker-compose down -v --remove-orphans || true
              else
                docker compose down -v --remove-orphans || true
              fi
            else
              echo "docker-compose.yml not found during teardown; skipping"
            fi
            rm -rf "$INTEGRATION_TMP_DIR"
          fi

      - name: Run integration tests (mysql)
        run: forj test:db-integration mysql -v

      - name: Run integration tests (postgres)
        run: forj test:db-integration postgres -v

      - name: Run integration tests (sqlite)
        run: forj test:db-integration sqlite -v
