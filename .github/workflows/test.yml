name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  GENERATOR_DOCKER_CACHE_VERSION: "v1"
  GOPRIVATE: "github.com/goforj/*"
  WIRE_INSTALL_TARGET: "github.com/goforj/wire/cmd/wire@v1.2.0"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            internal/coredeps/modules.go

      - name: Install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: Run Go tests
        run: go test ./... -v

      - name: Build GoForj binary
        run: go install ./cmd/forj

  watcher-stress:
    name: Watcher churn (race)
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            internal/coredeps/modules.go

      - name: Run watcher concurrency stress tests
        run: |
          set -euo pipefail
          devwatch_tests="$(go test ./internal/devwatch -list '^TestDevWatchEngineSustainedEditorStormCoalesces$')"
          grep -qx 'TestDevWatchEngineSustainedEditorStormCoalesces' <<<"$devwatch_tests"
          build_tests="$(go test ./internal/build -list '^TestConcurrentAtomicBuildPublicationNeverLaunchesPartialBinary$')"
          grep -qx 'TestConcurrentAtomicBuildPublicationNeverLaunchesPartialBinary' <<<"$build_tests"
          go test -race ./internal/devwatch ./internal/build \
            -run '^Test(DevWatchEngineSustainedEditorStormCoalesces|ConcurrentAtomicBuildPublicationNeverLaunchesPartialBinary)$' \
            -count=3 -timeout=15m -v

      - name: Run forj dev churn integration test
        run: |
          set -euo pipefail
          test_pattern='^TestDevWatcher(ChurnIntegration|PollingStress|Boundary(RejectedReplacementKeepsHealthyRuntime|PostPreparationStartFailureRetries|RelativeCommandDirectoryLaunchesPreparedSnapshot|ShutdownCancelsBlockedBuild|ChangeDuringRuntimeReplacementConverges)|MultiAppChurnIsolation|OutputBackpressureReapsProcesses|InitialInvalidProjectRecovers)$'
          discovered="$(go test -tags=watcherstress ./internal/forj -list "$test_pattern")"
          for test_name in \
            TestDevWatcherChurnIntegration \
            TestDevWatcherPollingStress \
            TestDevWatcherBoundaryRejectedReplacementKeepsHealthyRuntime \
            TestDevWatcherBoundaryPostPreparationStartFailureRetries \
            TestDevWatcherBoundaryRelativeCommandDirectoryLaunchesPreparedSnapshot \
            TestDevWatcherBoundaryShutdownCancelsBlockedBuild \
            TestDevWatcherBoundaryChangeDuringRuntimeReplacementConverges \
            TestDevWatcherMultiAppChurnIsolation \
            TestDevWatcherOutputBackpressureReapsProcesses \
            TestDevWatcherInitialInvalidProjectRecovers
          do
            grep -qx "$test_name" <<<"$discovered"
          done
          go test -race -tags=watcherstress ./internal/forj \
            -run "$test_pattern" \
            -count=1 -timeout=15m -v

  renders:
    needs: renders-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      CLICOLOR_FORCE: "1"
      FORJ_DEBUG: "1"
      # FORJ_RENDER_TIMINGS: "1"
      FORJ_TEST_RENDERS_WORKERS: "2"
      FORJ_TEST_RENDERS_SHARD_COUNT: "6"
      FORJ_TEST_RENDERS_SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go cache (renders)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum', 'internal/coredeps/modules.go', 'scripts/generate-renderwarm.sh', 'templates/**/*.go.tmpl', 'templates/embed.go', 'tools/renderwarm/go.mod', 'tools/renderwarm/main.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: Build GoForj binary
        run: go install ./cmd/forj

      - name: Run forj test-renders shard
        run: forj test:renders --profile=pr --run-tests

  renders-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules/build (renders seed)
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum', 'internal/coredeps/modules.go', 'scripts/generate-renderwarm.sh', 'templates/**/*.go.tmpl', 'templates/embed.go', 'tools/renderwarm/go.mod', 'tools/renderwarm/main.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Seed Go caches
        run: |
          bash scripts/generate-renderwarm.sh
          go mod download
          go install "$WIRE_INSTALL_TARGET"
          go install ./cmd/forj
          cd tools/renderwarm
          GOWORK=off go mod tidy
          GOWORK=off go build .

  integration-shards:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: framework 1/6
            args: framework --shard=1/6
          - name: framework 2/6
            args: framework --shard=2/6
          - name: framework 3/6
            args: framework --shard=3/6
          - name: framework 4/6
            args: framework --shard=4/6
          - name: framework 5/6
            args: framework --shard=5/6
          - name: framework 6/6
            args: framework --shard=6/6
          - name: multi-App
            args: framework --framework-profile=multiapp
          - name: rendered sqlite
            args: rendered --variant=sqlite
          - name: rendered mysql
            args: rendered --variant=mysql
          - name: rendered postgres
            args: rendered --variant=postgres
    env:
      CLICOLOR_FORCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            internal/coredeps/modules.go

      - name: Verify Docker runtime
        run: |
          docker info >/dev/null
          docker compose version >/dev/null

      - name: Install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: Build GoForj binary
        run: go build -o "$RUNNER_TEMP/forj" ./cmd/forj

      - name: Run integration shard
        env:
          FORJ_INTEGRATION_FORJ_PATH: ${{ runner.temp }}/forj
        run: '"$FORJ_INTEGRATION_FORJ_PATH" test:integration ${{ matrix.args }} -v'

  integration:
    name: integration
    if: ${{ always() }}
    needs: integration-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every integration shard
        env:
          SHARD_RESULT: ${{ needs.integration-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "One or more integration shards failed: $SHARD_RESULT"
            exit 1
          fi

  lighthouse-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLICOLOR_FORCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            internal/coredeps/modules.go

      - name: Verify Docker runtime
        run: |
          docker info >/dev/null
          docker compose version >/dev/null

      - name: Install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: Build GoForj binary
        run: go build -o "$RUNNER_TEMP/forj" ./cmd/forj

      - name: Run lighthouse integration tests
        env:
          FORJ_INTEGRATION_FORJ_PATH: ${{ runner.temp }}/forj
        run: '"$FORJ_INTEGRATION_FORJ_PATH" test:integration framework --framework-profile=lighthouse -v'

  backup-integration:
    name: Backup and Restore Integration
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache
      GOFORJ_BACKUP_INTEGRATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            integration/go.sum
            internal/coredeps/modules.go

      - name: Verify Docker runtime
        run: docker info

      - name: Verify native database clients
        run: |
          for client in mysql mysqldump psql pg_dump; do
            command -v "$client" >/dev/null
          done

      - name: Install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: Download integration modules
        working-directory: integration
        run: GOWORK=off go mod download

      - name: Validate generated App resource contract
        run: |
          GOCACHE=/tmp/gocache GOMODCACHE=/tmp/gomodcache \
            go run ./cmd/forj --dev test:render --silent

      - name: Run portable matrix and native SQLite/MySQL recovery
        working-directory: integration
        run: |
          GOWORK=off go test -tags=integration_backup ./... \
            -run 'TestPortableTransferMatrix|TestPortableCompatibilityFailures|TestNativeSQLiteBackupRestore|TestNativeMySQLBackupRestore' \
            -count=1 -v

      # Postgres native recovery runs separately because its container lifecycle
      # must not overlap with the broader transfer matrix in this test suite.
      - name: Run native Postgres recovery
        working-directory: integration
        env:
          GOFORJ_BACKUP_NATIVE_POSTGRES: "1"
        run: |
          GOWORK=off go test -tags=integration_backup ./... \
            -run '^TestNativePostgresBackupRestore$' \
            -count=1 -v

  uptime-gopher-demo:
    name: Uptime Gopher (Demo)
    runs-on: ubuntu-latest
    env:
      CLICOLOR_FORCE: "1"
      UPTIME_GOPHER_DEMO_DIR: /tmp/goforj_monitoring_verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            internal/coredeps/modules.go

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/demo/frontend/package-lock.json

      - name: Install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: Build GoForj binary
        run: go build -o "$RUNNER_TEMP/forj" ./cmd/forj

      - name: Render demo app
        run: |
          set -euo pipefail
          rm -rf "${UPTIME_GOPHER_DEMO_DIR}"
          mkdir -p "${UPTIME_GOPHER_DEMO_DIR}"
          cat > "${UPTIME_GOPHER_DEMO_DIR}/.goforj.yml" <<'YAML'
          project_name: DemoMonitoringVerify
          module_name: example.com/demomonitoringverify
          updated_at: "2026-04-18 00:00:00 UTC"
          dev:
            pre: []
            down: []
            auto_migrate: false
            down_on_exit: false
            sound_on_watch_error: false
            wire_paths: []
            watches: []
          render:
            components:
              cli: false
              demo_app: true
              auth: false
              web_api: true
              web_ui: true
              docker: false
              database_mysql: false
              database_postgres: false
              database_sqlite: true
              scheduler: true
              jobs: true
              stress_test: false
            goforj_version: ""
          YAML
          cd "${UPTIME_GOPHER_DEMO_DIR}"
          "$RUNNER_TEMP/forj" render

      - name: Run demo backend monitoring tests
        run: |
          set -euo pipefail
          cd "${UPTIME_GOPHER_DEMO_DIR}"
          go test ./internal/monitoring -count=1 -v

      - name: Run demo frontend monitoring tests
        run: |
          set -euo pipefail
          cd "${UPTIME_GOPHER_DEMO_DIR}/cmd/app/frontend"
          npm ci --prefer-offline --no-audit
          npm run test:monitoring-ui

  generator-integration:
    runs-on: ubuntu-latest
    env:
      CLICOLOR_FORCE: "1"
      GOCACHE: ${{ github.workspace }}/.cache/generator-go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/generator-go-mod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore generator integration Go caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: generator-go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum', 'go.mod', 'integration/go.sum', 'integration/go.mod', 'internal/coredeps/modules.go') }}
          restore-keys: |
            generator-go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Verify Docker runtime
        run: docker info >/dev/null

      - name: Restore Docker image cache
        id: generator-docker-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/generator-docker-images
          key: generator-docker-${{ runner.os }}-${{ env.GENERATOR_DOCKER_CACHE_VERSION }}-${{ hashFiles('.github/generator-integration-images.txt') }}
          restore-keys: |
            generator-docker-${{ runner.os }}-${{ env.GENERATOR_DOCKER_CACHE_VERSION }}-
            generator-docker-${{ runner.os }}-

      - name: Load cached Docker images
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/generator-docker-images"
          if [ ! -d "$cache_dir" ]; then
            exit 0
          fi
          shopt -s nullglob
          for archive in "$cache_dir"/*.tar; do
            docker load -i "$archive"
          done

      - name: Prime Docker images for generator integration
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/generator-docker-images"
          mkdir -p "$cache_dir"
          mapfile -t images < .github/generator-integration-images.txt
          for image in "${images[@]}"; do
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
            archive_name="$(echo "$image" | tr '/:' '__').tar"
            if [ ! -f "$cache_dir/$archive_name" ]; then
              docker save "$image" -o "$cache_dir/$archive_name"
            fi
          done

      - name: Validate and download Go modules
        run: |
          cd integration
          GOWORK=off go mod tidy -diff
          GOWORK=off go mod download

      - name: Run generator integration smoke tests
        run: |
          set -euo pipefail
          cd integration
          GOWORK=off go test -tags=integration_generator ./... -run 'TestGenerate(Cache|Storage)FilesIntegrationSmoke' -count=1 -v
