name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  GENERATOR_DOCKER_CACHE_VERSION: "v1"

jobs:
  test:
#    if: false # disable default job
    # runs-on: [self-hosted, linux, x64, docker, goforj]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Purge Go build cache
        if: false # Temporarily disabled: deterministic test-renders workspace should improve cache reuse.
        run: |
          set -euo pipefail
          GOCACHE_DIR="$(go env GOCACHE)"
          echo "Purging GOCACHE at: $GOCACHE_DIR"
          rm -rf "$GOCACHE_DIR"
          # Defensive cleanup for self-hosted runner paths that can leak across Docker overlays.
          rm -rf "$HOME/.cache/go-build" || true
          go clean -cache -testcache || true

      # ------------------------------------------------------------------
      # Pre-fetch modules (local runner cache)
      # ------------------------------------------------------------------
      - name: Download Go modules
        run: go mod download

      # ------------------------------------------------------------------
      # Install wire once (local runner cache)
      # ------------------------------------------------------------------
      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Run unit tests
        run: go test ./... -v

      # ------------------------------------------------------------------
      # Build GoForj binary
      # ------------------------------------------------------------------
      - name: Build GoForj binary
        run: go install ./cmd/forj

  renders:
    needs: renders-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      CLICOLOR_FORCE: "1"
      FORJ_DEBUG: "1"
      # FORJ_RENDER_TIMINGS: "1"
      FORJ_TEST_RENDERS_WORKERS: "1"
      FORJ_TEST_RENDERS_SHARD_COUNT: "6"
      FORJ_TEST_RENDERS_SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go cache (renders)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum', 'scripts/generate-renderwarm.sh', 'templates/**/*.go.tmpl', 'templates/embed.go', 'tools/renderwarm/go.mod', 'tools/renderwarm/main.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Download Go modules
        run: go mod download

      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Build GoForj binary
        run: go install ./cmd/forj

      - name: Run forj test-renders shard
        run: forj test:renders --full

  renders-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules/build (renders seed)
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum', 'scripts/generate-renderwarm.sh', 'templates/**/*.go.tmpl', 'templates/embed.go', 'tools/renderwarm/go.mod', 'tools/renderwarm/main.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Seed Go caches
        run: |
          bash scripts/generate-renderwarm.sh
          go mod download
          go install github.com/goforj/wire/cmd/wire@latest
          go install ./cmd/forj
          cd tools/renderwarm
          GOWORK=off go mod tidy
          GOWORK=off go build .

  lighthouse-integration:
#    runs-on: [self-hosted, linux, x64, docker, goforj]
    runs-on: ubuntu-latest
    env:
      CLICOLOR_FORCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Purge Go build cache
        if: false # Restored build cache should be reusable across workflow runs.
        run: |
          set -euo pipefail
          GOCACHE_DIR="$(go env GOCACHE)"
          echo "Purging GOCACHE at: $GOCACHE_DIR"
          rm -rf "$GOCACHE_DIR"
          # Defensive cleanup for self-hosted runner paths that can leak across Docker overlays.
          rm -rf "$HOME/.cache/go-build" || true
          go clean -cache -testcache || true

      - name: Verify Docker runtime
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            if [ "$(id -u)" = "0" ]; then
              apt-get update
              apt-get install -y docker.io
            else
              echo "Docker is missing and sudo is unavailable; please preinstall Docker on this runner."
              exit 1
            fi
          fi
          if ! command -v docker-compose >/dev/null 2>&1 && ! docker compose version >/dev/null 2>&1; then
            if [ "$(id -u)" = "0" ]; then
              apt-get update
              apt-get install -y docker-compose-plugin
            else
              echo "Docker Compose is missing and sudo is unavailable; please preinstall Docker Compose on this runner."
              exit 1
            fi
          fi
          docker info
          if command -v docker-compose >/dev/null 2>&1; then
            docker-compose version
          else
            docker compose version
          fi

      - name: Download Go modules
        run: go mod download

      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Build GoForj binary
        run: go install ./cmd/forj

      - name: Run lighthouse integration tests
        run: go test -tags=integration ./internal/forj -v

  integration:
#    runs-on: [self-hosted, linux, x64, docker, goforj]
    runs-on: ubuntu-latest
    env:
      CLICOLOR_FORCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Purge Go build cache
        if: false # Restored build cache should be reusable across workflow runs.
        run: |
          set -euo pipefail
          GOCACHE_DIR="$(go env GOCACHE)"
          echo "Purging GOCACHE at: $GOCACHE_DIR"
          rm -rf "$GOCACHE_DIR"
          # Defensive cleanup for self-hosted runner paths that can leak across Docker overlays.
          rm -rf "$HOME/.cache/go-build" || true
          go clean -cache -testcache || true

      - name: Verify Docker runtime
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            if [ "$(id -u)" = "0" ]; then
              apt-get update
              apt-get install -y docker.io
            else
              echo "Docker is missing and sudo is unavailable; please preinstall Docker on this runner."
              exit 1
            fi
          fi
          if ! command -v docker-compose >/dev/null 2>&1 && ! docker compose version >/dev/null 2>&1; then
            if [ "$(id -u)" = "0" ]; then
              apt-get update
              apt-get install -y docker-compose-plugin
            else
              echo "Docker Compose is missing and sudo is unavailable; please preinstall Docker Compose on this runner."
              exit 1
            fi
          fi
          docker info
          if command -v docker-compose >/dev/null 2>&1; then
            docker-compose version
          else
            docker compose version
          fi

      - name: Download Go modules
        run: go mod download

      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Build GoForj binary
        run: go install ./cmd/forj

      - name: Validate generated OpenAPI
        run: forj test:openapi

      - name: Run DB integration tests (mysql)
        run: |
          set -euo pipefail
          forj test:db-integration mysql -v

      - name: Run DB integration tests (postgres)
        run: |
          set -euo pipefail
          forj test:db-integration postgres -v

      - name: Run DB integration tests (sqlite)
        run: |
          set -euo pipefail
          forj test:db-integration sqlite -v

  generator-integration:
#    runs-on: [self-hosted, linux, x64, docker, goforj]
    runs-on: ubuntu-latest
    env:
      CLICOLOR_FORCE: "1"
      GOCACHE: ${{ github.workspace }}/.cache/generator-go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/generator-go-mod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore generator integration Go caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: generator-go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('integration/go.sum', 'integration/go.mod', 'integration/generator_integration_test.go') }}
          restore-keys: |
            generator-go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Verify Docker runtime
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            if [ "$(id -u)" = "0" ]; then
              apt-get update
              apt-get install -y docker.io
            else
              echo "Docker is missing and sudo is unavailable; please preinstall Docker on this runner."
              exit 1
            fi
          fi
          docker info

      - name: Restore Docker image cache
        id: generator-docker-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/generator-docker-images
          key: generator-docker-${{ runner.os }}-${{ env.GENERATOR_DOCKER_CACHE_VERSION }}-${{ hashFiles('.github/workflows/test.yml', 'integration/generator_integration_test.go') }}

      - name: Load cached Docker images
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/generator-docker-images"
          if [ ! -d "$cache_dir" ]; then
            exit 0
          fi
          shopt -s nullglob
          for archive in "$cache_dir"/*.tar; do
            docker load -i "$archive"
          done

      - name: Prime Docker images for generator integration
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/generator-docker-images"
          mkdir -p "$cache_dir"
          images=(
            "redis:7-alpine"
            "memcached:1.6-alpine"
            "amazon/dynamodb-local:2.5.4"
            "postgres:16-alpine"
            "mysql:8.4"
            "nats:2.10-alpine"
          )
          for image in "${images[@]}"; do
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
            archive_name="$(echo "$image" | tr '/:' '__').tar"
            if [ ! -f "$cache_dir/$archive_name" ]; then
              docker save "$image" -o "$cache_dir/$archive_name"
            fi
          done

      - name: Download Go modules
        run: |
          cd integration
          GOWORK=off go mod download

      - name: Run generator integration smoke tests
        run: |
          set -euo pipefail
          cd integration
          GOWORK=off go test -tags=integration_generator ./... -run 'TestGenerate(Cache|Storage)FilesIntegrationSmoke' -count=1 -v
