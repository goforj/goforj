name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod tidy

      - name: Install wire
        run: go install github.com/google/wire/cmd/wire@latest

      - name: Run unit tests
        run: go test ./... -v

      - name: Build GoForj binary
        run: go install ./cmd/forj

      - name: Run forj test-renders
        run: forj test:renders