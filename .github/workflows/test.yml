name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, docker, goforj]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # ------------------------------------------------------------------
      # Pre-fetch modules (not cached, but very fast and reliable)
      # ------------------------------------------------------------------
      - name: Download Go modules
        run: go mod download

      # ------------------------------------------------------------------
      # Install wire once (fast since build cache is restored)
      # ------------------------------------------------------------------
      - name: Install wire
        run: go install github.com/goforj/wire/cmd/wire@latest

      - name: Run unit tests
        run: go test ./... -v

      # ------------------------------------------------------------------
      # Build GoForj binary (after cache restore)
      # ------------------------------------------------------------------
      - name: Build GoForj binary
        run: go install ./cmd/forj

      # ------------------------------------------------------------------
      # Run forj test-renders
      # Make sure it uses THE SAME caches for wire/build speed
      # ------------------------------------------------------------------
      - name: Run forj test-renders
        env:
          GOMODCACHE: /home/runner/go/pkg/mod       # default; safe
          GOCACHE: /home/runner/.cache/go-build     # from cache
          CLICOLOR_FORCE: "1"
        run: forj test:renders --full
