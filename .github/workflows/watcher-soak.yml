name: watcher soak

permissions:
  contents: read

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

env:
  GO_VERSION: "1.26"

jobs:
  watcher-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: run reproducible watcher schedules
        run: |
          set -euo pipefail
          for seed in 1 42 8675309 2147483647 922337203685477580
          do
            echo "watcher soak seed: $seed"
            GOFORJ_WATCHER_SOAK_SEED="$seed" go test -race -tags=watcherstress ./internal/forj \
              -run '^TestDevWatcherBuildThunderingHerd$' -count=3 -timeout=10m -v
            GOFORJ_WATCHER_SOAK_SEED="$seed" go test -race -tags=watcherstress ./internal/forj \
              -run '^TestDevWatcherChurnIntegration$' -count=1 -timeout=10m -v
          done

      - name: record coordination benchmarks
        run: go test ./internal/forj -run '^$' -bench '^BenchmarkDevWatcherBuildGate' -benchmem -count=10 | tee watcher-benchmarks.txt

      - name: retain benchmark history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watcher-benchmarks-${{ github.run_id }}
          path: watcher-benchmarks.txt
          retention-days: 90
